name: Source checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-check:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Validate avatar and workshop source
        run: npm run check

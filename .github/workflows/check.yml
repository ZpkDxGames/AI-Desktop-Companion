name: Source and browser runtime checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  node-check:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        run: npm install --no-audit --no-fund
      - name: Emit dependency lock candidate for recovery
        shell: pwsh
        run: |
          node -e "const fs=require('fs');const b=fs.readFileSync('package-lock.json').toString('base64');for(let i=0;i<b.length;i+=2048)console.log('LOCK_CHUNK='+b.slice(i,i+2048))"
      - name: Validate avatar and workshop source
        run: npm run check
      - name: Install isolated browser smoke dependency
        run: npm install --no-save --no-package-lock playwright@1.56.1
      - name: Install Chromium runtime
        run: npx playwright install chromium
      - name: Exercise emitted production bundle (cold storage)
        run: node scripts/smoke-browser.mjs
      - name: Preserve browser failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: production-browser-smoke-${{ github.run_id }}
          path: smoke-artifacts/*
          if-no-files-found: ignore

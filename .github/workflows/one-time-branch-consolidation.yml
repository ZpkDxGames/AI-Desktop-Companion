name: One-time development branch consolidation
on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-consolidation.yml']
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'ZpkDxGames/AI-Desktop-Companion'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve divergent history and remove only verified obsolete branches
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -Eeuo pipefail
          git merge-base --is-ancestor 6dc129a5824fd2db0a6c44926d8fae548ddbb5ff HEAD
          git cat-file -e HEAD:docs/ACTIVE_ANIMATIONS_AND_LOGIC_SUMMARY.md
          mapfile -t entries <<'BRANCHES'
          dev/alpha5-rig-audit|b14374f95af9e6c3629d5680bcbcdf1f3dc34bf0
          dev/alpha6-avatar-viewer-rebuild|15f12bc999719c0a4514bf5bb4b9251a48d56242
          dev/avatar-face-fidelity-and-frame-pacing|630b723b6582c4fe0e53f4e33325ac6587fd5ff1
          dev/avatar-geometry-and-expressions|559e6741ac6aa8cd7eea6dfc2d2357a8131110a6
          dev/companion-behavior-and-idle-animations|5fbedbe779cce36cc04ba5b3d172777a3c9270d9
          dev/desktop-recovery-workspace-2026-10-12|0e81798d45bbbfc14ad78a9f739bdb9caae234db
          dev/expressive-eyes-fresh-moves|c694fedec21bec3ba45467594bce6803b6d6836c
          dev/minecraft-animation-fidelity-v2|4f5554683e3b23cc4c3de0a9a6cf3f1585beade6
          dev/native-item-rig-fidelity-v3|6dc129a5824fd2db0a6c44926d8fae548ddbb5ff
          BRANCHES
          echo 'Checking exact tip SHA for each obsolete branch...'
          for entry in "${entries[@]}"; do
            IFS='|' read -r branch expected <<< "$entry"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$actual" != "$expected" ]]; then echo "Ref moved: $branch; stopping" >&2; exit 1; fi
          done
          archive='archive/alpha5-rig-audit-pre-v3-consolidation-2026-10-13'
          historical='b14374f95af9e6c3629d5680bcbcdf1f3dc34bf0'
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$archive" >/dev/null 2>&1; then
            existing="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$archive" --jq '.object.sha')"
            [[ "$existing" == "$historical" ]] || { echo 'Archive tag unexpectedly points elsewhere' >&2; exit 1; }
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/git/refs" -f ref="refs/tags/$archive" -f sha="$historical" >/dev/null
          fi
          echo "Preserved legacy Alpha5-only commits as tag $archive"
          for entry in "${entries[@]}"; do
            IFS='|' read -r branch expected <<< "$entry"
            actual="$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$branch" --jq '.object.sha')"
            [[ "$actual" == "$expected" ]] || { echo "Ref moved before delete: $branch" >&2; exit 1; }
            gh api --method DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch" >/dev/null
            echo "Deleted $branch ($expected)"
          done
          remaining="$(gh api "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name')"
          [[ "$remaining" == 'main' ]] || { echo "Unexpected remaining branches: $remaining" >&2; exit 1; }
          echo 'PASS: main is the only remaining branch.'

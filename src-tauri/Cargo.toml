[package]
name = "zpkdx-desktop-agent"
version = "0.1.0-alpha.2"
description = "ZpkDxGames 3D Minecraft desktop companion"
authors = ["ZpkDxGames"]
edition = "2021"

[lib]
name = "zpkdx_desktop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

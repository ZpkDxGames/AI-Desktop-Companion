[package]
name = "zpkdx-desktop-agent"
version = "0.1.0-alpha.7.0.0"
description = "ZpkDxGames 3D Minecraft desktop companion"
authors = ["ZpkDxGames"]
edition = "2021"

[lib]
name = "zpkdx_desktop_agent_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2" }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["sync", "macros", "time"] }

# V7 in-memory image admission; no filesystem/capture plugins or extra codecs.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg"] }
base64 = "0.22"
rand = "0.8"
